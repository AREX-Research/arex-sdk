[project]
name = "arex-python-sdk"
version = "1.0.1"
description = "Python SDK for the AREX public APIs."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "AREX Research" }]
keywords = ["arex", "research", "search", "contents", "sdk"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = ["httpx>=0.27,<1"]

[project.urls]
Homepage = "https://github.com/AREX-Research/arex-sdk"
Repository = "https://github.com/AREX-Research/arex-sdk"
Issues = "https://github.com/AREX-Research/arex-sdk/issues"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "build>=1.2",
    "mypy>=1.15",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.11",
]

[tool.hatch.build.targets.wheel]
packages = ["src/arex"]

[tool.hatch.build.targets.sdist]
include = ["src", "README.md", "LICENSE", "pyproject.toml"]

[tool.ruff]
target-version = "py310"
line-length = 88
extend-exclude = ["src/arex/_wire.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src", "tests"]
